<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ subject }}</title>
    <style>
      body { background: #f6f9fc; margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; color: #222; }
      .container { max-width: 560px; margin: 24px auto; background: #ffffff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); overflow: hidden; }
      .header { background: #0b5fff; color: #ffffff; padding: 16px 20px; font-size: 18px; font-weight: 600; }
      .content { padding: 20px; line-height: 1.55; font-size: 14px; }
      .btn { display: inline-block; margin: 16px 0; padding: 10px 16px; background: #0b5fff; color: #ffffff !important; text-decoration: none; border-radius: 6px; font-weight: 600; }
      .muted { color: #666; font-size: 12px; }
      .footer { padding: 16px 20px; background: #f2f5f8; font-size: 12px; color: #5b5b5b; }
      .code { font-family: Consolas, Monaco, 'Courier New', monospace; background: #f2f4f7; padding: 8px 12px; border-radius: 6px; display: inline-block; letter-spacing: 2px; font-weight: 700; }
      .divider { height: 1px; background: #e9edf3; margin: 16px 0; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">{{ app_name }}</div>
      <div class="content">
        {{ body }}
        <div class="divider"></div>
        <p class="muted">If you didn't request this, you can safely ignore this email.</p>
      </div>
      <div class="footer">
        © {{ year }} {{ app_name }} • This is an automated message, please do not reply
      </div>
    </div>
  </body>
<\/html>
